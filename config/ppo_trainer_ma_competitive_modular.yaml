behaviors:
  # Define a reusable PPO base config and then map it to the behavior names
  default_ppo: &default_ppo
    trainer_type: ppo
    # max_steps: 5000000
    max_steps: 100000
    time_horizon: 2048
    # summary_freq: 10000
    summary_freq: 1
    keep_checkpoints: 5
    threaded: true
    hyperparameters:
      batch_size: 2048
      # batch_size: 4096        
      # buffer_size: 20480
      buffer_size: 40960
      # learning_rate: 0.0003
      learning_rate: 0.003
      # beta: 5.0e-3
      # beta: 5.0e-1
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 10
    network_settings:
      normalize: false
      hidden_units: 128
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
  # === HIDER TEAM ===
  Hider0:
    <<: *default_ppo
    self_play:
      window: 5
      play_against_latest_model_ratio: 0.5
      save_steps: 2000
      swap_steps: 5000
      team_change: 1.0
    hyperparameters:
      batch_size: 2048
      buffer_size: 40960
      # learning_rate: 3.0e-4
      learning_rate: 0.003
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 10
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
      curiosity:
        strength: 0.02
        gamma: 0.99
    network_settings:
      hidden_units: 256
      num_layers: 3

