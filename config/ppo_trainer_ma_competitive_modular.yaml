behaviors:
  # === BASE PPO CONFIGURATION ===
  default_ppo: &default_ppo
    trainer_type: ppo
    max_steps: 900000
    time_horizon: 512 # from 2048, 512
    summary_freq: 1
    keep_checkpoints: 1
    threaded: true
    hyperparameters:
      batch_size: 512 # from 2048, 512
      buffer_size: 40960 # 40960, 8192
      learning_rate: 0.001 # from  0.003
      learning_rate_schedule: linear
      beta: 0.01 # 0.005
      beta_schedule: linear
      epsilon: 0.4 # 0.2
      epsilon_schedule: linear
      lambd: 0.95
      num_epoch: 10
    network_settings:
      normalize: false
      hidden_units: 128
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99 # 0.99, 0.8
        strength: 1.0

  # === TEMPLATE FOR HIDER TEAM ===
  hider_base: &hider_base
    <<: *default_ppo
    self_play:
      window: 5
      play_against_latest_model_ratio: 0.5
      save_steps: 50000
      swap_steps: 250
      team_change: 1.0
    hyperparameters:
      batch_size: 512 # from 2048
      buffer_size: 40960 # 40960
      learning_rate: 0.001 # from  0.003
      learning_rate_schedule: linear
      beta: 0.01 # 0.005
      beta_schedule: linear
      epsilon: 0.4 # 0.2
      epsilon_schedule: linear
      lambd: 0.8
      num_epoch: 10
    reward_signals:
      extrinsic:
        gamma: 0.8 # 0.99
        strength: 0.1
      curiosity:
        strength: 0.01
        gamma: 0.99 # 0.99, 0.8
    network_settings:
      hidden_units: 256
      num_layers: 3

  # === TEMPLATE FOR SEEKER TEAM ===
  seeker_base: &seeker_base
    <<: *default_ppo
    self_play:
      window: 5
      play_against_latest_model_ratio: 0.5
      save_steps: 50000
      swap_steps: 250
      team_change: 1.0
    hyperparameters:
      batch_size: 512 # from 2048
      buffer_size: 40960 # 40960
      learning_rate: 0.001 # from  0.003
      learning_rate_schedule: linear
      beta: 0.01 # 0.005
      beta_schedule: linear
      epsilon: 0.4 # 0.2
      epsilon_schedule: linear
      lambd: 0.8
      num_epoch: 10
    reward_signals:
      extrinsic:
        gamma: 0.8
        strength: 0.1
      curiosity:
        strength: 0.01
        gamma: 0.99
    network_settings:
      hidden_units: 256
      num_layers: 3

  # === HIDER TEAM AGENTS ===
  Hider0: *hider_base
  Hider1: *hider_base
  Hider2: *hider_base

  # === SEEKER TEAM AGENTS ===
  Seeker0: *seeker_base
  Seeker1: *seeker_base
  Seeker2: *seeker_base

  # === COMPOSITE BEHAVIOR ===
  HideAndSeekAgent: *default_ppo

engine_settings:
  width: 1280
  height: 720
  quality_level: 1
  time_scale: 20
  capture_frame_rate: 60
  no_graphics: true

checkpoint_settings:
  run_id: hide_seek_selfplay_v3
  initialize_from: null
  resume: false

torch_settings:
  device: cuda
