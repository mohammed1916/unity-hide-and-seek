behaviors:
  # Define a reusable PPO base config and then map it to the behavior names
  default_ppo: &default_ppo
    trainer_type: ppo
    # max_steps: 5000000
    max_steps: 50000
    time_horizon: 2048
    # summary_freq: 10000
    summary_freq: 1
    keep_checkpoints: 5
    threaded: true
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 0.0003
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 10
    network_settings:
      normalize: false
      hidden_units: 128
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    # You can also enable curiosity/other reward signals here if desired

  # Primary behavior name used in the project. If your Agent's BehaviorParameters
  # use a different Behavior Name (e.g. "HideAndSeekAgent"), add an entry below
  # or change the BehaviorParameters in the Unity inspector.
  HideAndSeekBehavior: *default_ppo
  # Alias for agents that use the name "HideAndSeekAgent" (common mismatch).
  # Keeps the same settings as HideAndSeekBehavior so training will start.
  HideAndSeekAgent: *default_ppo

# NOTE: ML-Agents will log TensorBoard metrics (including mean rewards) to results/<run-id>/summaries
# The Unity-side StatsRecorder (used in GameController) writes custom scalars under "Environment/*" which
# will also be visible in TensorBoard. The trajectory JSON files are written to
# trajectory_logs by the TrajectoryLogger component.
